<!DOCTYPE html>
<html lang="en">
<head>
	<title>EquirectangularToCubemap</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<style>
		body {
			font-family: Monospace;
			background-color: #f0f0f0;
			color: white;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>
<body>

	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { EquirectangularToCubemap } from '../src/EquirectangularToCubemap.js';

		let camera, scene, renderer;
		let controls;

		init();
		animate();

		function init() {

			const container = document.createElement( 'div' );
			document.body.appendChild( container );

			camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 10000 );
			camera.position.set( 0, 0, 50 );

			scene = new THREE.Scene();

			renderer = new THREE.WebGLRenderer();
			renderer.setClearColor( 0xf0f0f0 );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			container.appendChild( renderer.domElement );

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableZoom = false;

			const loader = new THREE.TextureLoader();
			loader.load( 'pano-cru·ci·form-1471040116139.jpg', function( res ) {

				res.colorSpace = THREE.SRGBColorSpace;

				const equiToCube = new EquirectangularToCubemap( renderer );
				const cubemap = equiToCube.convert( res, 2048 );

				const mesh = new THREE.Mesh(
					new THREE.TorusKnotGeometry( 10, 3, 100, 32 ),
					new THREE.MeshBasicMaterial( { envMap: equiToCube.convert( res, 8 ) } )
				);
				scene.add( mesh );

				const mesh2 = new THREE.Mesh(
					new THREE.IcosahedronGeometry( 10, 7 ),
					new THREE.MeshBasicMaterial( { envMap: cubemap } )
				);
				scene.add( mesh2 );

				scene.background = cubemap;

			} );

			window.addEventListener( 'resize', onWindowResize, false );
			onWindowResize();

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			requestAnimationFrame( animate );

			controls.update();
			renderer.render( scene, camera );

		}

	</script>

</body>
</html>
